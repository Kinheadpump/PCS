[workspace]
resolver = "3"
members = ["crates/base", "crates/worldgen", "crates/sim", "crates/game", "crates/tools"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
base = { path = "crates/base" }
worldgen = { path = "crates/worldgen" }
sim = { path = "crates/sim" }
macroquad = { version = "0.4.16", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
ron = "0.12.2"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
